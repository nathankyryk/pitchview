[project]
name = "pitchview"
version = "0.1.0"
description = "Soccer game-state reconstruction from broadcast video (RF-DETR, SAM 3.1, ByteTrack, pitch calibration, jersey numbers), evaluated on SoccerNet GSR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Data and utilities
    "numpy>=1.26,<2",  # SAM 3.1 needs numpy < 2; pinned on both platforms so they match
    "pillow>=10",
    "soccernet>=0.2.0",
    "pyarrow>=22,<26",  # 26+ requires numpy 2
    "tabulate",  # silences a TrackEval import warning
    "duckdb",
    "opencv-python-headless",
    "pandas",
    "typer",
    "setuptools<82",  # SAM 3.1 imports pkg_resources; 81.0 verified to still ship it
    # Models
    "torch>=2.11,<2.12",  # newest release built for CUDA 12.8; same version on both platforms
    "torchvision>=0.26,<0.27",
    "rfdetr[train]>=1.11",  # [train] brings PyTorch Lightning and the COCO evaluators
    "tensorboard",  # training curves (RF-DETR logs to it by default)
    "supervision>=0.29",
    "trackers>=2.6",  # Roboflow's ByteTrack (moved out of supervision)
    "ultralytics",  # runs Roboflow's pretrained pitch-keypoint model (AGPL-3.0)
    "transformers>=5.1,<6",
    "timm",  # needed by PARSeq (jersey numbers), loaded through torch.hub
    "nltk",  # PARSeq's model code imports nltk.edit_distance at load time
    "scikit-learn",
    "umap-learn",
    # Evaluation: SoccerNet's TrackEval fork, which adds the official GS-HOTA metric
    "sn-trackeval",
    # Demo app
    "gradio",
    # SAM 3.1 runs only on the Linux GPU pod. einops and scikit-image are
    # imported by its video code but missing from its own dependency list.
    "sam3 ; sys_platform == 'linux'",
    "einops ; sys_platform == 'linux'",
    "scikit-image ; sys_platform == 'linux'",
]

[project.scripts]
pitchview = "pitchview.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["data", "outputs", "weights"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# `trackers` declares numpy>=2, but SAM 3.1 needs numpy<2. Its ByteTrack is plain
# numpy/scipy and is covered by tests/test_track.py on numpy 1.26, so the pin wins.
# It also asks for the desktop OpenCV build; we keep the headless one (same `cv2`
# module, no GUI libraries needed on the pod).
override-dependencies = [
    "numpy>=1.26,<2",
    "opencv-python; sys_platform == 'never'",
]
# One lockfile for both machines: the Windows PC (CPU) and the Runpod pod (Linux + CUDA).
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
sam3 = { git = "https://github.com/facebookresearch/sam3", rev = "7f473cfd983d5eb43040ff608f66bff0d7bdcb53" }
sn-trackeval = { git = "https://github.com/SoccerNet/sn-trackeval", rev = "9c25232f6f2b56c9f203f1eb55784ff1e97df683" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
